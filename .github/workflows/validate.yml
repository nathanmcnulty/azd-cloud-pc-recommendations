name: Validate template

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Bicep, hooks, Python, and fixtures
        shell: pwsh
        run: .\scripts\validate.ps1
      - name: Validate fixture report
        shell: pwsh
        run: .\scripts\Test-LocalFixtures.ps1 | Out-Host
