name: Security hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f README.md
          test -f azure.yaml
          test -f infra/main.bicep
          test -f src/cloud-pc-monitor/function_app.py
          if git grep -n -E -e '-----BEGIN [A-Z ]*PRIVATE KEY-----|(^|[^A-Za-z])eyJ[A-Za-z0-9_-]{20,}' -- ':!*.md'; then
            echo 'Secret-shaped content found.' >&2
            exit 1
          fi
